# Documentation
# https://uwsgi-docs.readthedocs.io/en/latest/ThingsToKnow.html
# https://uwsgi-docs.readthedocs.io/en/latest/Options.html

[uwsgi]

module          = wsgi
need-app        = true
master          = true
lazy-apps       = true
die-on-term     = true

processes      = 1
threads        = 50
thunder-lock   = true
enable-threads = true
# Only nginx (same host, host networking) may talk to uWSGI directly
socket         = 127.0.0.1:5000
# Plain HTTP on loopback for rclone's OAuth token refreshes (/internal/oauth/token)
http-socket    = 127.0.0.1:5001

# clear environment on exit
vacuum          = true
