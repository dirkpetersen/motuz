# Documentation
# https://uwsgi-docs.readthedocs.io/en/latest/ThingsToKnow.html
# https://uwsgi-docs.readthedocs.io/en/latest/Options.html

[uwsgi]

module          = wsgi
need-app        = true
master          = true
lazy-apps       = true
die-on-term     = true

processes      = 1
threads        = 50
thunder-lock   = true
enable-threads = true
# Plain HTTP on loopback only. Traefik (same host, host networking) proxies :5000;
# the app also serves the built frontend (api/views/frontend_views.py)
http-socket    = 127.0.0.1:5000
# rclone's OAuth token refreshes (/internal/oauth/token, TOKEN_BROKER_URL). The app
# answers /internal only on this socket, and Traefik never forwards /internal
http-socket    = 127.0.0.1:5001
# Request headers (JWTs, cookies, Traefik's X-Forwarded-*) must fit; the default is 4k
buffer-size    = 32768
# Log the client address Traefik reports instead of 127.0.0.1
log-x-forwarded-for = true

# clear environment on exit
vacuum          = true
