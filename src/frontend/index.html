<h1 style="font-weight:400">Motuz</h1>
<p>Motuz is a web interface for large data transfers between on-premise storage and
cloud storage (Amazon S3, Azure Blob Storage, Google Cloud Storage, Google Drive,
Microsoft OneDrive, Dropbox, SFTP, WebDAV, ...). It uses
<a href="https://rclone.org/">rclone</a> to copy and verify files, and runs every
operation as the signed-in user's own account. Users sign in with their institutional
user name and password.</p>
<p><strong>JavaScript is required to use Motuz.</strong> Please enable it in your browser.</p>
