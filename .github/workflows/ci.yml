name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: python manage.py test
        working-directory: src/backend
        # api/config.py needs these at import time; the tests never connect to a database
        env:
          MOTUZ_FLASK_SECRET_KEY: ci-dummy
          MOTUZ_DATABASE_PROTOCOL: postgresql
          MOTUZ_DATABASE_USER: ci
          MOTUZ_DATABASE_PASSWORD: ci
          MOTUZ_DATABASE_NAME: ci
          MOTUZ_DATABASE_HOST: 127.0.0.1:5432
        run: python manage.py test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    name: End-to-end (docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/e2e/ui/package-lock.json
      - name: Install playwright and chromium (UI suite)
        working-directory: test/e2e/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # Builds the images (bin/prod/build.sh), starts the stack on :80/:443 with host
      # networking, runs all suites and tears down. rclone's OneDrive client secret is
      # revealed inside the built app image, so the runner needs no rclone. The checks
      # against real S3 are skipped: MOTUZ_E2E_AWS_PROFILE is not set.
      - name: test/e2e/run.sh
        env:
          MOTUZ_E2E_UI: require
        run: test/e2e/run.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: test/e2e/logs/
          retention-days: 14

  # The default install (README "Install (default: without Docker)"): systemd --user
  # services of the account motuz, tested in a machine with systemd as PID 1.
  e2e-systemd-al2027:
    name: End-to-end (systemd install, Amazon Linux 2027 container)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # install.sh, deploy.sh and all suites run inside a privileged container with systemd
      # as PID 1 and its own network namespace (test/e2e/systemd/container.sh); the private
      # PostgreSQL and Valkey, the default on Amazon Linux. The UI suites install chromium
      # and its libraries (dnf) inside the container.
      - name: test/e2e/run_systemd.sh --distro=al2027
        env:
          MOTUZ_E2E_UI: require
        run: test/e2e/run_systemd.sh --distro=al2027
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-systemd-al2027-logs
          path: test/e2e/logs-systemd-al2027/
          retention-days: 14

  e2e-systemd-ubuntu:
    name: End-to-end (systemd install, Ubuntu 26.04 VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # QEMU/KVM in a container (test/e2e/systemd/vm.sh) needs /dev/kvm, which the hosted
      # Linux runners provide once the udev rule gives the runner user access
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Cache the Ubuntu 26.04 cloud image
        uses: actions/cache@v4
        with:
          path: ~/.cache/motuz-e2e
          key: ubuntu-2604-cloudimg-${{ hashFiles('test/e2e/systemd/vm.sh') }}
      # The default on Ubuntu: the distribution's PostgreSQL 18 and Redis services
      - name: test/e2e/run_systemd.sh
        env:
          MOTUZ_E2E_UI: require
        run: test/e2e/run_systemd.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-systemd-ubuntu-logs
          path: test/e2e/logs-systemd/
          retention-days: 14
