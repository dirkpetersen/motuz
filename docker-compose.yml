# See the fully generated file using
# docker-compose config


x-variables:
    - &database-environment
        MOTUZ_DATABASE_PROTOCOL:    # from ./.env
        MOTUZ_DATABASE_USER:        # from ./.env
        MOTUZ_DATABASE_HOST:        # from ./.env
        MOTUZ_DATABASE_NAME:        # from ./.env
        MOTUZ_DATABASE_REQUIRE_SSL: # from ./.env
    - &smtp-environment
        MOTUZ_SMTP_SERVER:          # from ./.env
        MOTUZ_SMTP_USER:            # from ./.env
        MOTUZ_SMTP_REQUIRE_SSL:     # from ./.env
        MOTUZ_ALERT_ADDRESS:        # from ./.env
    - &oauth-environment
        # Own OneDrive app registration (README, "OneDrive: own app registration"). Empty
        # means rclone's public app. The client secret is the MOTUZ_ONEDRIVE_CLIENT_SECRET
        # docker secret, given to the app only.
        MOTUZ_ONEDRIVE_CLIENT_ID: ${MOTUZ_ONEDRIVE_CLIENT_ID:-}
        MOTUZ_ONEDRIVE_REDIRECT_URI: ${MOTUZ_ONEDRIVE_REDIRECT_URI:-}
        # Own Google OAuth client (README, "Google Drive"), the same way. The secret is
        # the MOTUZ_GDRIVE_CLIENT_SECRET docker secret.
        MOTUZ_GDRIVE_CLIENT_ID: ${MOTUZ_GDRIVE_CLIENT_ID:-}
        MOTUZ_GDRIVE_REDIRECT_URI: ${MOTUZ_GDRIVE_REDIRECT_URI:-}
    - &operator-environment
        # Who runs this installation, shown on the public /privacy and /terms pages
        # (README, "Privacy policy and terms"). Empty: "the administrator of this Motuz
        # installation".
        MOTUZ_OPERATOR_NAME: ${MOTUZ_OPERATOR_NAME:-}
        MOTUZ_CONTACT_EMAIL: ${MOTUZ_CONTACT_EMAIL:-}
        MOTUZ_OPERATOR_URL: ${MOTUZ_OPERATOR_URL:-}
    - &shared-volumes
        volumes:
            # Using system users for authentication
            - /etc/passwd:/etc/passwd:ro
            - /etc/group:/etc/group:ro
            - /etc/shadow:/etc/shadow:ro

            # Authentication (PAM, Kerberos, SSSD configuration, sudoers) comes from the host's
            # /etc. It cannot mount individual files, because the mapping is based on the inode.
            # Hosts using SSSD or nscd also need their sockets, see docker-compose.override.yml
            - /etc:/etc:ro


secrets:
    MOTUZ_DATABASE_PASSWORD:
        file: ${MOTUZ_DOCKER_ROOT:-/docker}/secrets/MOTUZ_DATABASE_PASSWORD
    MOTUZ_FLASK_SECRET_KEY:
        file: ${MOTUZ_DOCKER_ROOT:-/docker}/secrets/MOTUZ_FLASK_SECRET_KEY
    MOTUZ_SMTP_PASSWORD:
        file: ${MOTUZ_DOCKER_ROOT:-/docker}/secrets/MOTUZ_SMTP_PASSWORD
    # Optional, empty unless an own OneDrive app is configured. bin/prod/start.sh creates
    # the empty file if it is missing (bin/_utils/optional_secrets.sh), since compose
    # refuses to start with a missing secret file.
    MOTUZ_ONEDRIVE_CLIENT_SECRET:
        file: ${MOTUZ_DOCKER_ROOT:-/docker}/secrets/MOTUZ_ONEDRIVE_CLIENT_SECRET
    # Optional, empty unless an own Google OAuth client is configured (same as above)
    MOTUZ_GDRIVE_CLIENT_SECRET:
        file: ${MOTUZ_DOCKER_ROOT:-/docker}/secrets/MOTUZ_GDRIVE_CLIENT_SECRET


services:
    traefik:
        # TLS termination and routing on :80 (redirects to https) and :443, the only
        # ports open beyond loopback. Routing, headers and certificates are in
        # deployment/docker/traefik/dynamic/motuz.yml (file provider; no docker socket).
        container_name: motuz_traefik
        image: traefik:v3.7
        network_mode: host
        # Static configuration. Traefik takes it from exactly one source, and its YAML
        # file cannot read environment variables, so flags let .env set MOTUZ_ACME_*.
        # No api/dashboard, ping or metrics are enabled.
        command:
            - --global.checkNewVersion=false
            - --global.sendAnonymousUsage=false
            - --log.level=INFO
            - --accessLog=true # to stdout
            - --entryPoints.web.address=:80
            - --entryPoints.web.http.redirections.entryPoint.to=websecure
            - --entryPoints.web.http.redirections.entryPoint.scheme=https
            - --entryPoints.web.http.aliasHeadersStrategy=delete
            - --entryPoints.websecure.address=:443
            # WSGI turns X_Forwarded_For into HTTP_X_FORWARDED_FOR too: drop such aliases
            - --entryPoints.websecure.http.aliasHeadersStrategy=delete
            # uWSGI decodes these in PATH_INFO, so path rules could be bypassed with them
            - --entryPoints.websecure.http.encodedCharacters.allowEncodedSlash=false
            - --entryPoints.websecure.http.encodedCharacters.allowEncodedBackSlash=false
            - --entryPoints.websecure.http.encodedCharacters.allowEncodedNullCharacter=false
            # Responses may start only after up to 600s (serversTransport in motuz.yml)
            - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=900s
            - --providers.file.directory=/etc/traefik/dynamic
            - --providers.file.watch=true
            # Only used when MOTUZ_ACME_DOMAIN is set (see README, "Set up HTTPS certificate")
            - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
            - --certificatesResolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json
            - --certificatesResolvers.letsencrypt.acme.email=${MOTUZ_ACME_EMAIL:-}
            - --certificatesResolvers.letsencrypt.acme.caServer=${MOTUZ_ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
        environment:
            MOTUZ_ACME_DOMAIN: ${MOTUZ_ACME_DOMAIN:-} # read by motuz.yml
        volumes:
            - ./deployment/docker/traefik/dynamic:/etc/traefik/dynamic:ro
            - ${MOTUZ_DOCKER_ROOT:-/docker}/certs:/certs:ro
            - ${MOTUZ_DOCKER_ROOT:-/docker}/traefik:/etc/traefik/acme


    app:
        # uWSGI on 127.0.0.1:5000 (for Traefik) and 127.0.0.1:5001 (token broker), both
        # loopback only (src/backend/wsgi.ini). Serves the API and the built frontend.
        container_name: motuz_app
        image: fredhutch/motuz_app:latest
        network_mode: host
        <<: *shared-volumes
        environment:
            <<: [*database-environment, *smtp-environment, *oauth-environment, *operator-environment]
        secrets:
            - MOTUZ_DATABASE_PASSWORD
            - MOTUZ_FLASK_SECRET_KEY
            - MOTUZ_SMTP_PASSWORD
            # Only the app signs in and refreshes tokens (token broker); celery never
            # needs it
            - MOTUZ_ONEDRIVE_CLIENT_SECRET
            - MOTUZ_GDRIVE_CLIENT_SECRET


    celery:
        container_name: motuz_celery
        image: fredhutch/motuz_celery:latest
        network_mode: host
        <<: *shared-volumes
        environment:
            <<: [*database-environment, *smtp-environment, *oauth-environment, *operator-environment]
        secrets:
            - MOTUZ_DATABASE_PASSWORD
            - MOTUZ_FLASK_SECRET_KEY
            - MOTUZ_SMTP_PASSWORD
        depends_on:
            - app # Build dependency


    rabbitmq:
        container_name: motuz_rabbitmq
        image: rabbitmq:3.13-alpine
        network_mode: host
        environment:
            # Erlang port mapper and distribution port on loopback only
            # Node name must resolve to loopback, where epmd listens
            RABBITMQ_NODENAME: rabbit@localhost
            ERL_EPMD_ADDRESS: 127.0.0.1
            RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -kernel inet_dist_use_interface {127,0,0,1}
        volumes:
            - ./deployment/docker/rabbitmq/10-motuz.conf:/etc/rabbitmq/conf.d/10-motuz.conf:ro
        ports:
            - 5672:5672
            - 15672:15672


    database:
        container_name: motuz_database
        image: postgres:18-alpine
        network_mode: host
        command: ["postgres", "-c", "listen_addresses=localhost"]
        environment:
            # postgres 18 images default to /var/lib/postgresql/<major>/docker
            PGDATA: /var/lib/postgresql/data
        volumes:
            - ${MOTUZ_DOCKER_ROOT:-/docker}/volumes/postgres:/var/lib/postgresql/data
        ports:
            - 5432:5432
