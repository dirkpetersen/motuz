# End-to-end test stack, started by test/e2e/run.sh. Mirrors docker-compose.yml (host
# networking, Traefik on :80/:443, uWSGI on 127.0.0.1:5000/5001) with test users instead
# of the host's /etc, OneDrive/Graph pointed at fake_ms.py on 127.0.0.1:5999, and Azurite
# for Azure Blob. MOTUZ_DOCKER_ROOT (secrets, certs) and the OD_* settings come from
# test/e2e/.env, which run.sh generates (never committed). Google sign-in and the Drive API
# also go to fake_ms.py.
name: motuz_e2e

x-env: &env
    MOTUZ_DATABASE_PROTOCOL: postgresql
    MOTUZ_DATABASE_USER: motuz_user
    MOTUZ_DATABASE_HOST: 0.0.0.0:5432
    MOTUZ_DATABASE_NAME: motuz
    MOTUZ_DATABASE_REQUIRE_SSL: "false"
    MOTUZ_SMTP_SERVER: 127.0.0.1:2525
    MOTUZ_SMTP_REQUIRE_SSL: "false"
    MOTUZ_SMTP_USER: ""
    MOTUZ_ALERT_ADDRESS: admin@example.com
    MOTUZ_ONEDRIVE_TOKEN_URL: http://127.0.0.1:5999/token
    MOTUZ_ONEDRIVE_AUTH_URL: http://127.0.0.1:5999/authorize
    MOTUZ_GRAPH_URL: http://127.0.0.1:5999/graph
    # Google sign-in and Drive API, also fake_ms.py (rclone's public Drive app)
    MOTUZ_GDRIVE_AUTH_URL: http://127.0.0.1:5999/google/authorize
    MOTUZ_GDRIVE_TOKEN_URL: http://127.0.0.1:5999/google/token
    MOTUZ_GDRIVE_API_URL: http://127.0.0.1:5999/google/drive/v3
    # Own-app mode (oauth-callback phase); empty = rclone's public app
    MOTUZ_ONEDRIVE_CLIENT_ID: ${OD_CLIENT_ID:-}
    MOTUZ_ONEDRIVE_REDIRECT_URI: ${OD_REDIRECT_URI:-}
    # /privacy and /terms (traefik_test.sh checks that the values are escaped)
    # rclone performance (e2e_test.py): an installation default and a cap
    MOTUZ_RCLONE_CHECKERS: "16"
    MOTUZ_RCLONE_MAX_TRANSFERS: "48"
    # Image viewer (e2e_test.py): a small cap, so that 413 needs no big file
    MOTUZ_VIEW_IMAGE_MAX_BYTES: "2M"
    # Document viewer (e2e_test.py): a small cap, so that 413 needs no big file
    MOTUZ_VIEW_DOCUMENT_MAX_BYTES: "4M"
    MOTUZ_OPERATOR_NAME: "E2E Lab <R&D>"
    MOTUZ_CONTACT_EMAIL: "motuz-admin@example.org"
    MOTUZ_OPERATOR_URL: "https://example.org/?a=1&b=2"
    # Remote workers (suite `worker` switches local jobs to the pool onprem); a short
    # lease so that the suite sees a killed worker's job fail quickly
    MOTUZ_LOCAL_JOB_POOL: ${LOCAL_JOB_POOL:-}
    MOTUZ_WORKER_LEASE_SECONDS: "20"

secrets:
    MOTUZ_DATABASE_PASSWORD:
        file: ${MOTUZ_DOCKER_ROOT:?run test/e2e/run.sh}/secrets/MOTUZ_DATABASE_PASSWORD
    MOTUZ_FLASK_SECRET_KEY:
        file: ${MOTUZ_DOCKER_ROOT:?run test/e2e/run.sh}/secrets/MOTUZ_FLASK_SECRET_KEY
    MOTUZ_SMTP_PASSWORD:
        file: ${MOTUZ_DOCKER_ROOT:?run test/e2e/run.sh}/secrets/MOTUZ_SMTP_PASSWORD
    MOTUZ_ONEDRIVE_CLIENT_SECRET:
        file: ${MOTUZ_DOCKER_ROOT:?run test/e2e/run.sh}/secrets/MOTUZ_ONEDRIVE_CLIENT_SECRET

volumes:
    homes:
    postgres:
    traefik_acme:

networks:
    # The remote worker's network (suite `worker`): no route anywhere; the proxy is the
    # only way out, and it tunnels only to motuz.test:443 (Traefik on the host)
    worker_isolated:
        internal: true
    proxy_egress: {}

services:
    database_init:
        image: fredhutch/motuz_database_init:latest
        network_mode: host
        profiles: [init]
        volumes: [postgres:/var/lib/postgresql/data]
        environment: *env
        secrets: [MOTUZ_DATABASE_PASSWORD]

    database:
        image: postgres:18-alpine
        network_mode: host
        command: ["postgres", "-c", "listen_addresses=localhost"]
        environment: {PGDATA: /var/lib/postgresql/data}
        volumes: [postgres:/var/lib/postgresql/data]

    rabbitmq:
        image: rabbitmq:3.13-alpine
        network_mode: host
        environment:
            RABBITMQ_NODENAME: rabbit@localhost
            ERL_EPMD_ADDRESS: 127.0.0.1
            RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -kernel inet_dist_use_interface {127,0,0,1}
        volumes: [../../deployment/docker/rabbitmq/10-motuz.conf:/etc/rabbitmq/conf.d/10-motuz.conf:ro]

    app:
        image: fredhutch/motuz_app:latest
        network_mode: host
        environment: *env
        secrets: [MOTUZ_DATABASE_PASSWORD, MOTUZ_FLASK_SECRET_KEY, MOTUZ_SMTP_PASSWORD, MOTUZ_ONEDRIVE_CLIENT_SECRET]
        volumes: [./users.sh:/users.sh:ro, homes:/home]
        command: ["/users.sh", "/app/src/backend/app-entrypoint.sh"]

    celery:
        image: fredhutch/motuz_celery:latest
        network_mode: host
        environment: *env
        secrets: [MOTUZ_DATABASE_PASSWORD, MOTUZ_FLASK_SECRET_KEY, MOTUZ_SMTP_PASSWORD]
        volumes: [./users.sh:/users.sh:ro, homes:/home]
        command: ["/users.sh", "./celery-entrypoint.sh"]

    traefik:
        # The production service (command flags, dynamic config, certs from
        # $MOTUZ_DOCKER_ROOT/certs); only the ACME storage moves to a volume
        extends:
            file: ../../docker-compose.yml
            service: traefik
        volumes:
            - traefik_acme:/etc/traefik/acme

    proxy:
        # HTTP CONNECT proxy between the isolated worker network and the stack: allows
        # only CONNECT motuz.test:443, where motuz.test is the host (Traefik on :443)
        image: fredhutch/motuz_app:latest
        profiles: [worker]
        networks: [worker_isolated, proxy_egress]
        extra_hosts: ["motuz.test:host-gateway"]
        volumes: [./connect_proxy.py:/connect_proxy.py:ro]
        entrypoint: ["python3", "-u", "/connect_proxy.py", "3128", "motuz.test:443"]

    worker:
        # A remote worker (motuz-worker as an unprivileged `motuz` account) that reaches
        # nothing but https://motuz.test through the proxy; alice and bob with the
        # shared homes, like an on-prem worker with the same mounts and users
        image: fredhutch/motuz_app:latest
        profiles: [worker]
        networks: [worker_isolated]
        depends_on: [proxy]
        environment:
            MOTUZ_CENTRAL_URL: https://motuz.test
            HTTPS_PROXY: http://proxy:3128
            MOTUZ_WORKER_POOL: onprem
            MOTUZ_REQUIRED_PATHS: /home
            MOTUZ_CA_BUNDLE: /etc/motuz-worker/ca.pem
            MOTUZ_WORKER_CREDENTIAL_FILE: /var/lib/motuz/.config/motuz-worker/credential
            MOTUZ_WORKER_ONCE_WAIT: "60"
        volumes:
            - ./users.sh:/users.sh:ro
            - ./worker_entry.sh:/worker_entry.sh:ro
            - homes:/home
            - ${MOTUZ_DOCKER_ROOT:?run test/e2e/run.sh}/worker:/run/motuz-worker:ro
        entrypoint: ["/worker_entry.sh"]
        command: []

    azurite:
        # Azure Blob emulator for the credentials suite (rclone remote in alice's home)
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        network_mode: host
        command: ["azurite-blob", "--blobHost", "127.0.0.1", "--blobPort", "10000", "--skipApiVersionCheck", "--loose", "--inMemoryPersistence"]
